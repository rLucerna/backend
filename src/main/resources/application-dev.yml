spring:
  # --- 데이터소스 (로컬 -> Docker postgres-service) ---
  datasource:
    url: jdbc:postgresql://localhost:5433/lucerna_service
    username: lucerna
    password: lucerna1234

  # --- JPA ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # --- DevTools 핫 리로드 ---
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

  # --- OAuth2 JWT (로컬 -> Docker keycloak) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/lucerna_test
          jwk-set-uri: http://localhost:8080/auth/realms/lucerna_test/protocol/openid-connect/certs

# --- Keycloak 커스텀 설정 (로컬 -> Docker keycloak) ---
keycloak:
  auth-server-url: http://localhost:8080/auth
  realm: lucerna_test
  client-id: lucerna-app
  token-uri: http://localhost:8080/auth/realms/lucerna_test/protocol/openid-connect/token
  logout-uri: http://localhost:8080/auth/realms/lucerna_test/protocol/openid-connect/logout
  revoke-uri: http://localhost:8080/auth/realms/lucerna_test/protocol/openid-connect/revoke

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE  # 바인드 파라미터 값도 출력 (? → 실제값)
    org.hibernate.orm.jdbc.extract: TRACE  # 결과 추출 과정도 출력