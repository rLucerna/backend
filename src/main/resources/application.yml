spring:
  application:
    name: lucerna-backend

  profiles:
    active: dev

  # --- PostgreSQL 데이터소스 (서비스 DB) ---
  datasource:
    url: jdbc:postgresql://localhost:5433/lucerna_service
    username: lucerna
    password: lucerna1234
    driver-class-name: org.postgresql.Driver

  # --- JPA/Hibernate 설정 ---
  jpa:
    hibernate:
      ddl-auto: update  # dev/test 환경: 자동 스키마 생성/업데이트, 운영: validate + 마이그레이션 사용
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true  # 로그에 SQL 포맷팅 출력 (디버깅용)

  # --- OAuth2 Resource Server (JWT 검증) ---
  security:
    oauth2:
      resourceserver:

# --- 서버 설정 ---
server:
  port: 8081

# --- Actuator (헬스체크/모니터링) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # 외부 노출 엔드포인트 제한
  endpoint:
    health:
      show-details: when-authorized  # 인증된 사용자만 상세 헬스 정보 확인 가능

# --- Keycloak 커스텀 설정 (KeycloakProperties에서 바인딩) ---
keycloak:
  auth-server-url:
  realm:
  client-id:
  token-uri:

# --- 로깅 레벨 ---
logging:
  level:
    root: INFO
    com.lucerna: DEBUG              # 애플리케이션 로그: DEBUG
    org.springframework.security: INFO  # Security 로그: INFO (너무 많은 출력 방지)