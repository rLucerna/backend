# 테스트 전용 설정 (H2 인메모리 DB 사용)
# @ActiveProfiles("test")로 활성화
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트마다 스키마 생성/삭제
    database-platform: org.hibernate.dialect.H2Dialect

  # JWT issuer-uri 검증 우회 (테스트 환경에서는 Keycloak 미구동)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/auth/realms/lucerna_test